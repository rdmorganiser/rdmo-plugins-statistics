name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # run CI only if files in these whitelisted paths are changed
    paths:
      - '.github/workflows/**'
      - 'rdmo_plugins_statistics/**'
      - 'scripts/**'
      - 'tests/**'
      - .nvmrc
      - .pre-commit-config.yaml
      - pyproject.toml
      - README.md

permissions:
  contents: read

# Ref: https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: 1
  FORCE_COLOR: 1 # colored output by pytest etc.
  CLICOLOR_FORCE: 1 # colored output by ruff

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: "3.12"
        cache: pip
    - run: python -m pip install --upgrade pip
    - run: python -m pip install -e .[dev]
    - name: Set up pre-commit cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with:
        path: ~/.cache/pre-commit
        key: lint-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run linters via pre-commit (ruff, eslint)
      run: pre-commit run --all-files --color=always

  dev-setup:
    # Ref: structlog (MIT licensed) <https://github.com/hynek/structlog/blob/main/.github/workflows/ci.yml>
    name: "Test dev setup on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
          cache: pip
      - run: python -Im pip install -e .[dev]
      - run: python -Ic 'import rdmo_plugins_statistics; print(rdmo_plugins_statistics.__version__)'

  test:
    name: "Test (${{ matrix.name }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RDMO 2.5
            rdmo: "rdmo>=2.5,<3"
          - name: RDMO 3.0 release branch
            rdmo: "rdmo @ git+https://github.com/rdmorganiser/rdmo.git@3.0.0/release"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install RDMO target
        run: python -m pip install "${{ matrix.rdmo }}"
      - name: Install plugin
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify wheel assets
        run: |
          unzip -l dist/*.whl | grep -q 'rdmo_plugins_statistics/templates/rdmo_plugins_statistics/statistics.html'
          unzip -l dist/*.whl | grep -q 'rdmo_plugins_statistics/locale/de/LC_MESSAGES/django.mo'
          unzip -l dist/*.whl | grep -q 'rdmo_plugins_statistics/static/rdmo_plugins_statistics/css/statistics.css'
          unzip -l dist/*.whl | grep -q 'rdmo_plugins_statistics/static/rdmo_plugins_statistics/js/chart.umd.min.js'

  javascript-test:
    name: JavaScript tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/statistics.test.cjs

  required-checks-pass:
    if: always()
    permissions: {}
    needs:
      - lint
      - dev-setup
      - test
      - javascript-test
    runs-on: ubuntu-22.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
